<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Yuzu Creation</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-dot"></span>
        Yuzu Creation
      </a>
      <ul class="nav-links">
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="music.html">Music</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="socials.html">Socials</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <span id="navAuth"></span>
      </ul>
    </div>
  </nav>

  <section class="page-top" id="gallery">
    <div class="container">
      <div class="section-head">
        <h2>My <span>gallery</span></h2>
      </div>
      <p>Every piece I've poured my heart into. Like the ones you love and drop a comment.</p>
      <div id="galleryGrid" class="grid-gallery">
        <div class="empty">Loading artworks...</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      &copy; <span id="year"></span> <span id="footerName">Yuzu Creation</span>. All rights reserved.
    </div>
  </footer>

  <div class="modal" id="commentModal" hidden>
    <div class="modal-backdrop" id="cmBackdrop"></div>
    <div class="modal-box">
      <div class="modal-head">
        <h3>Comments on: <span id="cmArtworkTitle">Artwork</span></h3>
        <button type="button" class="modal-close" id="cmClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="cmComments"></div>
      <div class="modal-foot">
        <input type="text" id="cmName" placeholder="Your name (optional)" maxlength="60" autocomplete="name" />
        <textarea id="cmText" placeholder="Say something nice..." maxlength="500" rows="2"></textarea>
        <button type="button" class="btn btn-primary" id="cmSend">Post comment</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
