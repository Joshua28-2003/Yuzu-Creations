<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join - Yuzu Creation</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-dot"></span>
        Yuzu Creation
      </a>
      <ul class="nav-links" id="navAuth"></ul>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="container-narrow">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">Join as a viewer - only the site admin can upload artwork and manage content.</p>
        <div id="formAlert" class="alert alert-error hidden"></div>
        <form id="registerForm" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" />
            <p class="hint">At least 6 characters.</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
        <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
